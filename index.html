<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS × SCI Irregular Verb Lab</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header><button id="home" class="brand"><span class="logo">V³</span><span>不规则动词实验室<small>IELTS × SCI Irregular Verb Lab</small></span></button><button id="theme">切换明暗</button></header><main><section id="landing"><p class="eyebrow">从记住词形，到写对句子</p><h1>过去发生了什么，<br>现在该用哪种形式？</h1><p class="muted">60 个动词 · 雅思与科研双语境<br>先主动回忆，再用时间线索验证。</p><div class="menu"><button data-mode="forms"><b>01　三态默写</b><span>分别回忆过去式与过去分词 →</span></button><button data-mode="ielts"><b>02　雅思句子填空</b><span>教育、城市、图表与日常生活 →</span></button><button data-mode="academic"><b>03　科研句子训练</b><span>实验、测量、电路与普通学术 →</span></button><button data-view="compare"><b>04　句型对照</b><span>比较过去时、完成时与被动 →</span></button><button id="challenge"><b>05　分类闯关</b><span>随机 10 题，独立答对再前进 →</span></button><button data-view="overview"><b>06　总览与收藏</b><span>查找词形、例句与学习记录 →</span></button></div><div class="bar"><button data-view="review">错题本与待掌握</button><button id="resume" hidden>继续上次练习</button></div><p id="homeStats" class="muted"></p></section><section id="setup" hidden><p class="eyebrow">每次专注 10 题</p><h1>选择变化规律</h1><label>分类 <select id="group"><option value="all">全部混合</option><option>AAA</option><option>ABA</option><option>ABB</option><option>ABC</option></select></label><p class="muted">AAA：三态同形；ABA：原形与分词同形；ABB：过去式与分词同形；ABC：三态不同（按主要形式分类）。不足10词的类别会先遍历本类，再重复抽取。</p><button id="startChallenge" class="primary">开始随机 10 题</button></section><section id="practice" hidden><div class="bar"><b id="position"></b><button id="favorite">☆ 收藏</button></div><progress id="progress"></progress><h1 id="title"></h1><div class="prompt"><small id="context"></small><h2 id="question"></h2><p id="meaning"></p></div><form id="form"><div id="inputs" class="input-grid"></div><p id="hint" class="muted" hidden></p><div class="actions"><button type="button" id="hintBtn">语法提示</button><button type="button" id="reset">重置 / 再试</button><button id="check" class="primary">检查答案</button><button type="button" id="next">下一题 →</button></div></form><div class="bar"><small id="stats"></small><button id="reveal" class="link">查看完整答案</button></div><p id="feedback" role="status" aria-live="polite"></p><article id="result" class="card" hidden></article></section><section id="library" hidden><div class="bar"><h1 id="libraryTitle"></h1><button id="hide">隐藏英文</button></div><div class="filters"><label>搜索<input id="search" placeholder="原形或中文释义"></label><label>分类<select id="filter"><option value="all">全部</option><option>AAA</option><option>ABA</option><option>ABB</option><option>ABC</option></select></label><label><input type="checkbox" id="favoritesOnly"> 只看收藏</label></div><p id="libraryInfo" class="muted"></p><div id="list"></div></section><section id="finished" hidden><p class="eyebrow">本轮完成</p><h1>把变化，留在记忆里。</h1><p id="score"></p><div id="roundErrors"></div><button id="restart" class="primary">再来一轮</button></section><p id="error" role="alert" hidden></p></main><footer>独立回忆 · 语境辨别 · 错题巩固<br>学习记录仅保存在当前浏览器</footer></body></html>
